<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{PAGE_DESC}}">
  <meta name="theme-color" content="#fffaf0">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{PAGE_DESC}}">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/app.css?v={{ASSET_VERSION}}">
</head>
<body class="home">
  <a class="skip-link" href="#games">跳到游戏列表</a>

  <header class="site-nav">
    <div class="container nav-inner">
      <a class="brand" href="/" aria-label="{{SITE_TITLE}} 首页">
        <span class="brand-mark"><img src="/assets/img/favicon.svg" alt="" width="36" height="36"></span>
        <span class="brand-text"><strong>{{SITE_TITLE}}</strong></span>
      </a>
    </div>
  </header>

  <main id="main">
    <h1 class="sr-only">{{SITE_TITLE}}</h1>

    <section class="browse container" id="games" aria-label="游戏列表">
      <div class="chips" id="categoryChips" role="group" aria-label="按分类筛选"></div>

      <div class="grid" id="gameGrid">
        <div class="game-card is-skeleton" aria-hidden="true">
          <div class="game-cover"></div>
          <div class="game-body"><span class="skeleton-line w60"></span><span class="skeleton-line w90"></span><span class="skeleton-line w40"></span></div>
        </div>
        <div class="game-card is-skeleton" aria-hidden="true">
          <div class="game-cover"></div>
          <div class="game-body"><span class="skeleton-line w50"></span><span class="skeleton-line w80"></span><span class="skeleton-line w30"></span></div>
        </div>
        <div class="game-card is-skeleton" aria-hidden="true">
          <div class="game-cover"></div>
          <div class="game-body"><span class="skeleton-line w70"></span><span class="skeleton-line w85"></span><span class="skeleton-line w35"></span></div>
        </div>
      </div>

      <div class="empty-state" id="emptyState" hidden>
        <img src="/assets/img/mascot.svg" alt="" width="80" height="80">
        <p>还没有游戏。把游戏放进 <code>games/</code> 目录，刷新页面就会出现。</p>
      </div>

      <noscript>
        <p class="empty-state">浏览游戏需要开启 JavaScript。</p>
      </noscript>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© {{YEAR}} {{SITE_TITLE}}</span>
    </div>
  </footer>

  <script src="/assets/js/common.js?v={{ASSET_VERSION}}" defer></script>
  <script src="/assets/js/home.js?v={{ASSET_VERSION}}" defer></script>
</body>
</html>
