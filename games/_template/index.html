<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新游戏模板</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: #fffaf0;
    color: #0a0a0a;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .card {
    width: min(520px, calc(100vw - 40px));
    padding: 36px;
    border-radius: 28px;
    background: #f5f0e0;
    text-align: center;
    box-shadow: 0 24px 50px -36px rgba(0, 0, 0, .5);
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { margin: 0 0 22px; color: #6a6a6a; line-height: 1.7; }
  button {
    border: 0;
    border-radius: 16px;
    padding: 16px 30px;
    background: #0a0a0a;
    color: #fff;
    font-size: 17px;
    cursor: pointer;
  }
  .count { margin-top: 18px; color: #ff4d8b; font-size: 28px; font-weight: 700; }
  code { background: #ebe6d6; border-radius: 6px; padding: 2px 6px; }
</style>
</head>
<body>
  <main class="card">
    <h1>🧩 新游戏模板</h1>
    <p>复制 <code>games/_template</code> 成 <code>games/你的名字</code>，<br>改 <code>game.json</code> 和这个页面，就能上架。</p>
    <button id="tap">点我试试</button>
    <div class="count"><span id="count">0</span> 次</div>
  </main>
  <script>
    let count = 0;
    const target = document.getElementById("count");
    document.getElementById("tap").addEventListener("click", () => {
      count += 1;
      target.textContent = String(count);
    });
  </script>
</body>
</html>
