<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奥特曼 · 怪兽退退退</title><link rel="stylesheet" href="game.css?v=1fa46f9b26a9"></head><body><main class="game"><section class="arena" id="arena" aria-label="城市守护战场">
