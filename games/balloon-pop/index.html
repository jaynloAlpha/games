<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>气球砰砰</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eaf6ff; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
  .hud { position: fixed; inset: 14px 16px auto; display: flex; justify-content: space-between; pointer-events: none; }
  .chip { background: rgba(255,255,255,.85); border-radius: 999px; padding: 8px 16px; font-size: 15px; color: #28405a; box-shadow: 0 8px 20px -12px rgba(20,60,100,.5); }
  .chip b { font-size: 20px; color: #0f2740; }
  .over { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(234,246,255,.86); backdrop-filter: blur(4px); }
  .card { background: #fff; border-radius: 28px; padding: 34px 42px; text-align: center; box-shadow: 0 30px 60px -30px rgba(20,60,100,.45); }
  .card h1 { margin: 0 0 6px; font-size: 30px; color: #0f2740; }
  .card p { margin: 0 0 18px; color: #5a7390; }
  .card strong { font-size: 42px; color: #ff4d8b; display: block; margin-bottom: 16px; }
  button { border: 0; border-radius: 16px; background: #0f2740; color: #fff; font-size: 16px; padding: 14px 28px; cursor: pointer; }
  button:active { transform: translateY(1px); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="chip">得分 <b id="score">0</b></div>
  <div class="chip">时间 <b id="time">30</b>s</div>
</div>
<div class="over" id="over" hidden>
  <div class="card">
    <h1>时间到！</h1>
    <p>你一共戳破了</p>
    <strong id="final">0</strong>
    <button id="again">再玩一次</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");
  const overEl = document.getElementById("over");
  const finalEl = document.getElementById("final");
  const colors = ["#ff6b9d", "#ffd166", "#7bdff2", "#b8a4ed", "#95e06c", "#ff9f68"];
  let width = 0, height = 0, dpr = 1;
  let balloons = [], pops = [], score = 0, timeLeft = 30, running = false, last = 0, spawnTimer = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = width * dpr; canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawn() {
    const r = 26 + Math.random() * 20;
    balloons.push({
      x: r + Math.random() * (width - r * 2),
      y: height + r + Math.random() * 60,
      r,
      speed: 55 + Math.random() * 85 + score * 1.2,
      sway: Math.random() * Math.PI * 2,
      color: colors[(Math.random() * colors.length) | 0],
      dead: false,
    });
  }

  function drawBalloon(b) {
    const wobble = Math.sin(b.sway) * 8;
    ctx.save();
    ctx.translate(b.x + wobble, b.y);
    ctx.strokeStyle = "rgba(60,90,120,.35)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, b.r * 1.05);
    ctx.quadraticCurveTo(10, b.r * 1.6, 0, b.r * 2.1);
    ctx.stroke();
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, b.r * 0.86, b.r, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.45)";
    ctx.beginPath();
    ctx.ellipse(-b.r * 0.28, -b.r * 0.3, b.r * 0.22, b.r * 0.34, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.moveTo(-b.r * 0.12, b.r * 0.98);
    ctx.lineTo(b.r * 0.12, b.r * 0.98);
    ctx.lineTo(0, b.r * 1.14);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function frame(now) {
    if (!running) return;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    timeLeft -= dt;
    timeEl.textContent = Math.max(0, Math.ceil(timeLeft));
    if (timeLeft <= 0) { end(); return; }

    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawn(); spawnTimer = Math.max(0.18, 0.55 - score * 0.006); }

    ctx.clearRect(0, 0, width, height);
    const sky = ctx.createLinearGradient(0, 0, 0, height);
    sky.addColorStop(0, "#dff1ff");
    sky.addColorStop(1, "#f7fbff");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, width, height);

    for (const b of balloons) {
      b.y -= b.speed * dt;
      b.sway += dt * 2.2;
      drawBalloon(b);
    }
    balloons = balloons.filter((b) => b.y > -b.r * 3 && !b.dead);

    for (const p of pops) {
      p.life -= dt * 2.4;
      if (p.life <= 0) continue;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3;
      for (let i = 0; i < 8; i++) {
        const a = (Math.PI * 2 * i) / 8;
        const d = (1 - p.life) * 46;
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(a) * d * 0.5, p.y + Math.sin(a) * d * 0.5);
        ctx.lineTo(p.x + Math.cos(a) * d, p.y + Math.sin(a) * d);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    pops = pops.filter((p) => p.life > 0);

    requestAnimationFrame(frame);
  }

  function popAt(x, y) {
    let hit = false;
    for (const b of balloons) {
      const wobble = Math.sin(b.sway) * 8;
      const dx = x - (b.x + wobble);
      const dy = y - b.y;
      if (!b.dead && (dx * dx) / (b.r * b.r * 0.86) + (dy * dy) / (b.r * b.r) <= 1.05) {
        b.dead = true;
        hit = true;
        score += 1;
        scoreEl.textContent = score;
        pops.push({ x: b.x + wobble, y: b.y, color: b.color, life: 1 });
        break;
      }
    }
    return hit;
  }

  canvas.addEventListener("pointerdown", (event) => {
    if (!running) return;
    popAt(event.clientX, event.clientY);
  });

  function start() {
    balloons = []; pops = []; score = 0; timeLeft = 30; spawnTimer = 0;
    // 开局先放几只气球，避免第一眼是一块空天空
    for (let i = 0; i < 6; i++) {
      spawn();
      const b = balloons[balloons.length - 1];
      b.y = height * (0.25 + Math.random() * 0.55);
    }
    scoreEl.textContent = "0";
    timeEl.textContent = "30";
    overEl.hidden = true;
    running = true;
    last = performance.now();
    requestAnimationFrame(frame);
  }

  function end() {
    running = false;
    finalEl.textContent = score;
    overEl.hidden = false;
  }

  document.getElementById("again").addEventListener("click", start);
  window.addEventListener("resize", resize);
  resize();
  start();
})();
</script>
</body>
</html>
