[package]
name = "clayplay"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Clay Play — a tiny self-hosted arcade for kids' HTML5 mini games"
license = "MIT"
repository = "https://github.com/jaynloAlpha/games"
default-run = "clayplay"

[[bin]]
name = "clayplay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
dotenvy = "0.15"
include_dir = "0.7"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
